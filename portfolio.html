<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elson Josh Tenoria · IT Student Portfolio</title>
  <meta name="description" content="Portfolio of Elson Josh Tenoria — BS Information Technology student building web, database, and system applications.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Sora', var(--font-body);
      --r-sm: 12px;
      --r-md: 18px;
      --r-lg: 26px;
      --r-xl: 34px;
      --r-pill: 100px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --nav-h: 68px;
    }

      html[data-theme="dark"] {
      --bg: radial-gradient(1000px circle at 50% 0%, #0b101b 0%, #070910 58%, #05070e 100%);
      --bg-2: #0c0f18;
      --surface: rgba(18, 23, 38, 0.66);
      --surface-solid: #141925;
      --surface-2: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f1f5ff;
      --text-dim: #b2bfe2;
      --text-mute: #7d89a9;
      --accent: #8fa3ff;
      --accent-2: #3ddcf3;
      --accent-soft: rgba(143, 163, 255, 0.16);
      --on-accent: #070910;
      --shadow: 0 28px 56px -24px rgba(0, 0, 0, 0.88);
      --shadow-lg: 0 46px 78px -30px rgba(0, 0, 0, 0.92);
      --orb-1: rgba(143, 163, 255, 0.22);
      --orb-2: rgba(61, 220, 243, 0.18);
      --orb-3: rgba(224, 93, 246, 0.16);
      --grid-line: rgba(255, 255, 255, 0.035);
      --glass-blur: 18px;
      --splash: rgba(255, 255, 255, 0.08);
    }

      html[data-theme="light"] {
      --bg: radial-gradient(900px circle at 50% 0%, #ffffff 0%, #f5f7fb 40%, #eef1f8 100%);
      --bg-2: #eef1f9;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --surface-2: rgba(15, 23, 42, 0.045);
      --border: rgba(15, 23, 42, 0.09);
      --border-strong: rgba(15, 23, 42, 0.16);
      --text: #0d1424;
      --text-dim: #3f4d6d;
      --text-mute: #6f7da1;
      --accent: #4253c7;
      --accent-2: #0c8ca8;
      --accent-soft: rgba(66, 83, 199, 0.10);
      --on-accent: #ffffff;
      --shadow: 0 24px 46px -28px rgba(21, 35, 80, 0.36);
      --shadow-lg: 0 44px 74px -34px rgba(21, 35, 80, 0.42);
      --orb-1: rgba(66, 83, 199, 0.16);
      --orb-2: rgba(12, 140, 168, 0.14);
      --orb-3: rgba(219, 39, 119, 0.10);
      --grid-line: rgba(15, 23, 42, 0.04);
      --glass-blur: 16px;
      --splash: rgba(15, 23, 42, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 20px); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background 0.45s var(--ease), color 0.45s var(--ease);
    }

    a { text-decoration: none; color: inherit; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.035em; line-height: 1.16; }

    ::selection { background: var(--accent); color: var(--on-accent); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

    .orb { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
    .orb-1 { width: 46vw; height: 46vw; top: -12vw; left: -8vw; background: var(--orb-1); animation: drift 26s ease-in-out infinite; }
    .orb-2 { width: 40vw; height: 40vw; top: 34vh; right: -12vw; background: var(--orb-2); animation: drift 32s ease-in-out infinite reverse; }
    .orb-3 { width: 38vw; height: 38vw; bottom: -10vw; left: 26vw; background: var(--orb-3); animation: drift 38s ease-in-out infinite; }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      33% { transform: translate3d(6vw, 5vh, 0) scale(1.12); }
      66% { transform: translate3d(-5vw, -4vh, 0) scale(0.92); }
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 62px 62px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 78%);
    }

    .progress-track { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--surface-2); z-index: 90; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 14px var(--accent); transition: width 0.1s linear; }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .wrapper { max-width: 1200px; width: 100%; margin: 0 auto; position: relative; z-index: 2; padding: 0 1.2rem; }

    .nav {
      position: sticky; top: 12px; z-index: 80;
      max-width: 1160px; margin: 12px auto 0;
      height: var(--nav-h);
      padding: 0 0.5rem 0 1.25rem;
      border-radius: var(--r-pill);
      display: flex; align-items: center; gap: 0.9rem;
      transition: box-shadow 0.45s var(--ease), transform 0.45s var(--ease), background 0.45s var(--ease), border-color 0.45s var(--ease);
      will-change: transform;
    }
    .nav.scrolled { box-shadow: var(--shadow-lg); transform: translateY(-2px); backdrop-filter: blur(calc(var(--glass-blur) + 4px)) saturate(150%); -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 4px)) saturate(150%); border-color: var(--border-strong); }

    .brand { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; letter-spacing: -0.02em; white-space: nowrap; }
    .brand-mark { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 0.8rem; color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--accent); }

    .nav-links { display: flex; align-items: center; gap: 0.15rem; margin-left: auto; }
    .nav-links a { position: relative; padding: 0.45rem 0.75rem; border-radius: var(--r-pill); font-size: 0.86rem; font-weight: 500; color: var(--text-mute); transition: color 0.25s, background 0.25s; }
    .nav-links a:hover { color: var(--text); background: var(--surface-2); }
    .nav-links a.active { color: var(--text); }
    .nav-links a.active::after { content: ''; position: absolute; left: 50%; bottom: 1px; width: 15px; height: 3px; border-radius: 3px; transform: translateX(-50%); background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

    .nav-actions { display: flex; align-items: center; gap: 0.5rem; }

    .theme-toggle { width: 56px; height: 30px; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--border); position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 7px; flex-shrink: 0; transition: background 0.3s, border-color 0.3s; }
    .theme-toggle:hover { border-color: var(--border-strong); }
    .theme-toggle i { font-size: 0.68rem; color: var(--text-mute); transition: color 0.3s; z-index: 1; }
    .theme-toggle .fa-sun { color: #fbbf24; }
    .tt-thumb { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 3px 10px -2px var(--accent); transition: transform 0.42s var(--ease); }
    html[data-theme="light"] .tt-thumb { transform: translateX(26px); }
    html[data-theme="light"] .fa-moon { color: var(--text-mute); }

    .nav-burger { display: none; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); }

    .hero { margin-top: 2.4rem; padding: clamp(1.6rem, 3.5vw, 2.6rem); border-radius: var(--r-xl); display: grid; grid-template-columns: auto 1fr; gap: clamp(1.6rem, 3vw, 2.6rem); align-items: center; position: relative; overflow: hidden; isolation: isolate; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(680px circle at 8% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 72%), linear-gradient(115deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 48%); pointer-events: none; }
    .hero::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; background: radial-gradient(560px circle at 92% 0%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 70%); pointer-events: none; z-index: -1; }

    .avatar-frame { position: relative; width: 148px; height: 148px; flex-shrink: 0; }
    .avatar-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--border-strong); animation: spin 26s linear infinite; }
    .avatar-ring.r2 { inset: -14px; border-color: var(--accent-soft); animation-duration: 38s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes blob {
      0%, 100% { border-radius: 46% 54% 38% 62% / 52% 42% 58% 48%; }
      33% { border-radius: 62% 38% 55% 45% / 42% 58% 42% 58%; }
      66% { border-radius: 38% 62% 48% 52% / 60% 44% 56% 40%; }
    }

    .avatar { position: absolute; inset: 10px; border-radius: 46% 54% 38% 62% / 52% 42% 58% 48%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-size: 3.4rem; color: var(--on-accent); box-shadow: 0 18px 34px -14px var(--accent); animation: blob 9s ease-in-out infinite; transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease); }
    .avatar-frame:hover .avatar { transform: scale(1.06); }
    .avatar.has-img { display: block; border-radius: 50%; animation: none; overflow: hidden; }
    .avatar.has-img img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: cover; border-radius: 50%; display: block; }

    .status-badge { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; background: #22c55e; border: 3px solid var(--bg); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); animation: pulse 2.4s ease-out infinite; z-index: 2; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); } 70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }

    .hero-body { position: relative; z-index: 1; }

    .hero-eyebrow { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.85rem; border-radius: var(--r-pill); background: var(--accent-soft); border: 1px solid var(--border); font-size: 0.78rem; font-weight: 500; color: var(--text-dim); margin-bottom: 0.9rem; }
    .hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

    .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; }
    .hero h1 .accent { background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .typed-line { display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; color: var(--text-dim); margin: 0.55rem 0 0.9rem; min-height: 1.7em; }
    .typed-line .prefix { color: var(--text-mute); }
    .typed-text { font-weight: 600; color: var(--text); }
    .caret { display: inline-block; width: 2px; height: 1.15em; background: var(--accent-2); border-radius: 2px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .hero-meta { display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem; color: var(--text-mute); font-size: 0.9rem; margin-bottom: 1.3rem; }
    .hero-meta span { display: inline-flex; align-items: center; gap: 0.45rem; }
    .hero-meta i { color: var(--accent); }

    .hero-bio { color: var(--text-dim); max-width: 58ch; margin-bottom: 1.5rem; }

    .chip-group { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-bottom: 1.6rem; }
    .chip { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.42rem 1rem; border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--border); font-size: 0.83rem; font-weight: 500; color: var(--text-dim); transition: transform 0.3s var(--ease), border-color 0.3s, color 0.3s, background 0.3s; }
    .chip i { font-size: 0.78rem; color: var(--accent); transition: transform 0.35s var(--ease); }
    .chip:hover { transform: translateY(-3px); color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

    .btn-row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.72rem 1.4rem; border-radius: var(--r-pill); font-size: 0.9rem; font-weight: 600; border: 1px solid transparent; transition: transform 0.3s var(--ease), box-shadow 0.3s, background 0.3s, border-color 0.3s, color 0.3s; }
    .btn i { transition: transform 0.3s var(--ease); }
    .btn:hover { transform: translateY(-2px); }
    .btn:hover i.fa-arrow-right { transform: translateX(3px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 14px 28px -14px var(--accent); }
    .btn-primary:hover { box-shadow: 0 20px 34px -14px var(--accent); }
    .btn-ghost { border-color: var(--border-strong); color: var(--text-dim); }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin: 1.6rem 0 0; }
    .stat-card { padding: 1.25rem 1.4rem; border-radius: var(--r-lg); display: flex; align-items: center; gap: 1rem; transition: transform 0.35s var(--ease), border-color 0.35s, box-shadow 0.35s; }
    .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
    .stat-icon { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 1.15rem; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--border); flex-shrink: 0; }
    .stat-number { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1.2; background: linear-gradient(180deg, var(--text), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 0.82rem; color: var(--text-mute); }

    .sec-head { display: flex; align-items: center; gap: 1rem; margin: 4.2rem 0 2rem; }
    .sec-icon { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 1.05rem; color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 22px -10px var(--accent); flex-shrink: 0; }
    .sec-head h2 { font-size: clamp(1.5rem, 3.2vw, 2rem); }
    .sec-sub { font-size: 0.9rem; color: var(--text-mute); margin-top: 0.15rem; }
    .sec-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); min-width: 20px; }

    .reveal { opacity: 0; translate: 0 26px; transition: opacity 0.7s var(--ease), translate 0.7s var(--ease); transition-delay: var(--delay, 0ms); }
    .reveal.in-view { opacity: 1; translate: 0 0; }

    .panel { padding: clamp(1.4rem, 2.8vw, 2rem); border-radius: var(--r-lg); }

    .split { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.2rem; align-items: start; }
    .split-even { grid-template-columns: 1fr 1fr; }

    .about-text p { color: var(--text-dim); margin-bottom: 1.1rem; }
    .about-text p:last-child { margin-bottom: 0; }
    .about-text strong { color: var(--text); font-weight: 600; }

    .focus-list { display: grid; gap: 0.8rem; }
    .focus-item { display: flex; gap: 0.95rem; padding: 1.05rem 1.15rem; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); transition: transform 0.3s var(--ease), border-color 0.3s, background 0.3s; }
    .focus-item:hover { transform: translateX(6px); border-color: var(--accent); background: var(--accent-soft); }
    .focus-item > i { color: var(--accent); margin-top: 0.2rem; }
    .focus-item h4 { font-size: 0.98rem; margin-bottom: 0.15rem; }
    .focus-item p { font-size: 0.85rem; color: var(--text-mute); }

    .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.1rem; }
    .service-card { padding: clamp(1.25rem, 2.4vw, 1.6rem) clamp(1.2rem, 2.4vw, 1.5rem); border-radius: var(--r-lg); position: relative; overflow: hidden; transition: transform 0.4s var(--ease), border-color 0.35s, box-shadow 0.4s; }
    .service-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); opacity: 0.55; transition: opacity 0.35s; }
    .service-card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
    .service-card:hover::before { opacity: 1; }
    .service-icon { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 1.2rem; color: var(--on-accent); background: linear-gradient(135deg, var(--sc, var(--accent)), var(--accent-2)); margin-bottom: 1.1rem; box-shadow: 0 10px 22px -12px var(--sc, var(--accent)); }
    .service-card h3 { font-size: 1.05rem; margin-bottom: 0.4rem; }
    .service-card p { font-size: 0.87rem; color: var(--text-mute); }

    .edu-card { padding: 1.9rem; border-radius: var(--r-lg); }
    .edu-top { display: flex; align-items: flex-start; gap: 1.2rem; margin-bottom: 1.3rem; }
    .edu-logo { width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; font-size: 1.4rem; color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 12px 26px -12px var(--accent); flex-shrink: 0; }
    .edu-period { display: inline-block; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 0.3rem; }
    .edu-card h3 { font-size: 1.3rem; margin-bottom: 0.2rem; }
    .edu-school { font-size: 0.92rem; color: var(--text-mute); }
    .edu-card > p { font-size: 0.93rem; color: var(--text-dim); margin-bottom: 1.3rem; }
    .edu-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 0.7rem; }
    .course-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .course-chip { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.4rem 0.9rem; border-radius: var(--r-pill); font-size: 0.82rem; font-weight: 500; color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); transition: transform 0.3s var(--ease), border-color 0.3s, color 0.3s; }
    .course-chip i { color: var(--accent); font-size: 0.75rem; }
    .course-chip:hover { transform: translateY(-3px); color: var(--text); border-color: var(--accent); }

    .ach-list { display: grid; gap: 0.8rem; }
    .ach-item { display: flex; gap: 1rem; padding: 1.15rem 1.25rem; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); transition: transform 0.3s var(--ease), border-color 0.3s, background 0.3s; }
    .ach-item:hover { transform: translateX(6px); border-color: var(--ac, var(--accent)); background: color-mix(in srgb, var(--ac, var(--accent)) 10%, transparent); }
    .ach-badge { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 1.1rem; color: var(--on-accent); background: linear-gradient(135deg, var(--ac, var(--accent)), var(--accent-2)); flex-shrink: 0; box-shadow: 0 10px 20px -12px var(--ac, var(--accent)); }
    .ach-item h4 { font-size: 1rem; margin-bottom: 0.15rem; }
    .ach-item p { font-size: 0.86rem; color: var(--text-mute); }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.6rem; }
    .filter-btn { padding: 0.48rem 1.05rem; border-radius: var(--r-pill); font-size: 0.85rem; font-weight: 500; color: var(--text-mute); background: var(--surface-2); border: 1px solid var(--border); transition: color 0.28s, background 0.28s, border-color 0.28s, transform 0.28s var(--ease); }
    .filter-btn:hover { color: var(--text); transform: translateY(-2px); }
    .filter-btn.active { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 10px 20px -12px var(--accent); }

      themeMeta.name = 'theme-color';

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        store.set('pf-theme', theme);
        themeMeta.content = theme === 'dark' ? '#070910' : '#f4f6fc';
      }

      const stored = store.get('pf-theme');
      setTheme(stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

      $('#themeToggle').addEventListener('click', () => {
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      const nav = $('#nav');
      const navLinks = $('#navLinks');
      const burger = $('#navBurger');
      const menuIcon = burger.querySelector('i');

      burger.addEventListener('click', () => {
        const open = navLinks.classList.toggle('open');
        burger.setAttribute('aria-expanded', String(open));
        menuIcon.className = open ? 'fas fa-xmark' : 'fas fa-bars';
      });
      navLinks.addEventListener('click', e => {
        if (e.target.tagName === 'A') {
          navLinks.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
          menuIcon.className = 'fas fa-bars';
        }
      });

      const navSections = ['about', 'services', 'work', 'design', 'toolbox', 'certificates', 'journey', 'contact'];
      const linkObserver = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          $$('#navLinks a').forEach(a => {
            const on = a.getAttribute('href') === '#' + en.target.id;
            a.classList.toggle('active', on);
            if (on) a.setAttribute('aria-current', 'true');
            else a.removeAttribute('aria-current');
          });
        });
      }, { rootMargin: '-45% 0px -50% 0px' });
      navSections.forEach(id => {
        const el = document.getElementById(id);
        if (el) linkObserver.observe(el);
      });

      const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting) {
            en.target.classList.add('in-view');
            revealObserver.unobserve(en.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
      $$('.reveal:not(.in-view)').forEach(el => revealObserver.observe(el));

      const fillObserver = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          en.target.style.width = en.target.dataset.level + '%';
          fillObserver.unobserve(en.target);
        });
      }, { threshold: 0.4 });
      $$('.skill-fill').forEach(el => fillObserver.observe(el));

      function countUp(el) {
        const target = +el.dataset.count;
        const suffix = el.dataset.suffix || '';
        if (reduced) { el.textContent = target + suffix; return; }
        const dur = 1500;
        let start = null;
        const step = ts => {
          if (!start) start = ts;
          const p = Math.min((ts - start) / dur, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(target * eased).toLocaleString() + suffix;
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      const countObserver = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          countUp(en.target);
          countObserver.unobserve(en.target);
        });
      }, { threshold: 0.5 });
      $$('[data-count]').forEach(el => countObserver.observe(el));

      if (finePointer && !reduced) {
        $$('.tilt').forEach(card => {
          card.addEventListener('pointermove', e => {
            const r = card.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            card.style.setProperty('--mx', px * 100 + '%');
            card.style.setProperty('--my', py * 100 + '%');
            card.style.setProperty('--rx', (0.5 - py) * -8 + 'deg');
            card.style.setProperty('--ry', (px - 0.5) * 8 + 'deg');
          });
          card.addEventListener('pointerleave', () => {
            card.style.setProperty('--rx', '0deg');
            card.style.setProperty('--ry', '0deg');
          });
        });
      }

      const grid = $('#projectsGrid');
      $('#filterBar').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        const filter = btn.dataset.filter;
        $$('.filter-btn').forEach(b => {
          const on = b === btn;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', String(on));
        });
        let shown = 0;
        $$('.project-card', grid).forEach(card => {
          const match = filter === 'All' || card.dataset.tags.split('|').includes(filter);
          card.classList.toggle('hidden', !match);
          if (match) {
            card.style.setProperty('--delay', (shown % 3) * 60 + 'ms');
            card.classList.remove('in-view');
            void card.offsetWidth;
            requestAnimationFrame(() => card.classList.add('in-view'));
            shown++;
          }
        });
      });

      const modal = $('#modal');
      const modalCard = $('#modalCard');
      let lastFocus = null;

      function openModal(id) {
        const p = CONFIG.projects.find(x => x.id === id);
        if (!p) return;
        lastFocus = document.activeElement;
        modalCard.style.setProperty('--pc', p.accent);
        modalCard.innerHTML = `
          <button class="modal-close" data-close aria-label="Close"><i class="fas fa-xmark"></i></button>
          ${shot((p.shots && p.shots[0] && p.shots[0].src) || p.image, p.title, 'modal-hero')}
          <h3 id="modalTitle">${p.title}</h3>
          <div class="modal-meta">
            <span class="modal-tag">${p.type}</span>
            <span class="modal-tag">${p.year}</span>
            ${p.tags.map(t => `<span class="modal-tag">${t}</span>`).join('')}
          </div>
          <div class="modal-block">
            <h4>Project overview</h4>
            <p>${p.summary}</p>
          </div>
          <div class="modal-block">
            <h4>Problem</h4>
            <p>${p.problem}</p>
          </div>
          <div class="modal-block">
            <h4>Features</h4>
            <div class="modal-fe">
              ${p.features.map(f => `<div><i class="fas fa-check"></i><span>${f}</span></div>`).join('')}
            </div>
          </div>
          <div class="modal-block">
            <h4>Technologies</h4>
            <div class="modal-tech">
              ${p.tech.map(t => `<span class="modal-tag"><i class="fas ${t === 'Java' ? 'fa-java' : t === 'Python' ? 'fa-python' : t === 'PHP' ? 'fa-php' : t === 'MySQL' ? 'fa-database' : 'fa-code'}"></i> ${t}</span>`).join('')}
            </div>
          </div>
          <div class="modal-block">
            <h4>My role</h4>
            <div class="role-grid">
              <div class="role-box"><b>Role</b><span>${p.role}</span></div>
              <div class="role-box"><b>Type</b><span>${p.type}</span></div>
              <div class="role-box"><b>Year</b><span>${p.year}</span></div>
            </div>
          </div>
          ${(p.shots || []).length ? `
          <div class="modal-block">
            <h4>Screenshots</h4>
            <div class="shot-grid">
              ${p.shots.map(s => shot(s.src, s.label)).join('')}
            </div>
          </div>` : ''}
          <div class="modal-actions">
            ${p.live ? `<a class="btn btn-primary" href="${p.live}" target="_blank" rel="noopener noreferrer">Live demo <i class="fas fa-arrow-up-right-from-square"></i></a>` : ''}
            ${p.source ? `<a class="btn btn-ghost" href="${p.source}" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i>Source code</a>` : ''}
            <a class="btn btn-ghost" href="mailto:${CONFIG.email}?subject=Re: ${encodeURIComponent(p.title)}"><i class="fa-regular fa-envelope"></i>Ask about it</a>
          </div>`;
        hydrateShots(modalCard);
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        $('.modal-close', modalCard).focus();
      }

      function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        if (lastFocus) lastFocus.focus();
      }

      grid.addEventListener('click', e => {
        const card = e.target.closest('.project-card');
        if (card) openModal(card.dataset.id);
      });
      grid.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest('.project-card');
        if (card) { e.preventDefault(); openModal(card.dataset.id); }
      });
      modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
      document.addEventListener('keydown', e => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') { closeModal(); return; }
        if (e.key !== 'Tab') return;
        const f = $$('a[href], button:not([disabled])', modalCard);
        if (!f.length) return;
        const first = f[0];
        const last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });

      const typedEl = $('#typedText');
      const roles = CONFIG.roles;
      if (reduced) {
        typedEl.textContent = roles[0];
      } else {
        let r = 0, c = 0, deleting = false;
        (function type() {
          const word = roles[r];
          typedEl.textContent = word.slice(0, c);
          let delay = deleting ? 45 : 85;
          if (!deleting && c === word.length) { deleting = true; delay = 1900; }
          else if (deleting && c === 0) { deleting = false; r = (r + 1) % roles.length; delay = 350; }
          else c += deleting ? -1 : 1;
          setTimeout(type, delay);
        })();
      }

      let toastTimer;
      function showToast(msg) {
        $('#toastMsg').textContent = msg;
        $('#toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 2600);
      }

      async function copyEmail() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(CONFIG.email);
            showToast(`Copied ${CONFIG.email}`);
            return;
          }
        } catch (err) { /* fall through */ }
        const ta = document.createElement('textarea');
        ta.value = CONFIG.email;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        ta.remove();
        showToast(ok ? `Copied ${CONFIG.email}` : `Copy manually: ${CONFIG.email}`);
      }

      const cvBtn = $('#downloadCv');
      if (cvBtn && CONFIG.resume) {
        cvBtn.addEventListener('click', e => {
          e.preventDefault();
          const probe = new Image();
          probe.onload = () => { window.location.href = CONFIG.resume; };
          probe.onerror = () => showToast(`Add your CV as "${CONFIG.resume}" to enable this download`);
          probe.src = CONFIG.resume;
        });
      }

      document.addEventListener('click', e => {
        if (e.target.closest('#copyEmail')) copyEmail();
      });

      const progressBar = $('#progressBar');
      let ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          progressBar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
          nav.classList.toggle('scrolled', window.scrollY > 24);
          ticking = false;
        });
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      onScroll();
    })();
  </script>
</body>
</html>
